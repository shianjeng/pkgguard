name: Publish

# Publishing a GitHub release publishes the same version to npm and moves the
# v0 tag that "uses: shianjeng/pkgguard@v0" follows.
#
# npm trusted publishing: no npm token is stored anywhere. npm checks this
# workflow's GitHub identity instead and attaches a provenance attestation to
# every version. One-time setup on npmjs.com: the package's Settings →
# Trusted publishing → GitHub Actions, with user "shianjeng", repository
# "pkgguard" and workflow "publish.yml".

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm 11.5.1 or later; Node 24 ships it.
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: The release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error title=publish::Release tag $TAG does not match package.json version $version"
            exit 1
          fi
      - run: npm test
      - name: Publish to npm
        env:
          # A release marked as a pre-release goes out under "next", not "latest".
          DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: npm publish --tag "$DIST_TAG"

  major-tag:
    needs: publish
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Point the major tag at this release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          major="${TAG%%.*}"
          git tag -f "$major"
          git push -f origin "refs/tags/$major"
