name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  live:
    # Talks to the real registries, so a registry outage can fail it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Known-good packages pass
        run: node skills/pkgguard/scripts/pkgguard.mjs npm:lodash pypi:requests
      - name: Known-bad packages are blocked
        run: |
          set +e
          node skills/pkgguard/scripts/pkgguard.mjs npm:crossenv npm:expresss
          test $? -eq 2
