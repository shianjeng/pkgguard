name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Registry and OSV response formats change without notice, and unit tests
    # use fixtures, so only a live run catches it. Weekly, Monday 06:17 UTC.
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  live:
    # Talks to the real registries, so a registry outage can fail it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Known-good packages pass
        run: node skills/pkgguard/scripts/pkgguard.mjs npm:lodash pypi:requests
      - name: Known-bad packages are blocked
        run: |
          set +e
          node skills/pkgguard/scripts/pkgguard.mjs npm:crossenv npm:expresss
          test $? -eq 2

  action:
    # Runs this repository's action the way a user's workflow would.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: A clean project passes
        id: ok
        uses: ./
        with:
          path: test/fixtures/action-ok
      - name: A typosquat fails the step
        id: bad
        uses: ./
        continue-on-error: true
        with:
          path: test/fixtures/action-bad
      - name: Check the outcomes
        env:
          OK: ${{ steps.ok.outputs.verdict }}
          BAD: ${{ steps.bad.outputs.verdict }}
          BAD_OUTCOME: ${{ steps.bad.outcome }}
        run: |
          echo "ok=$OK bad=$BAD bad_outcome=$BAD_OUTCOME"
          test "$OK" = ok && test "$BAD" = block && test "$BAD_OUTCOME" = failure
